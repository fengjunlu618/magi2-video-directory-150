:root{--gold:#d6ac5c;--ink:#0b0d14;--paper:#f5f0e6;--muted:#9a9487;--line:rgba(214,172,92,.2);}
*{box-sizing:border-box;}
body{margin:0;background:var(--ink);color:var(--paper);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}

/* ===== 置顶固定播放器 ===== */
.top{position:sticky;top:0;z-index:50;background:var(--ink);
     border-bottom:1px solid var(--line);box-shadow:0 6px 30px rgba(0,0,0,.6);}
.top-inner{max-width:1200px;margin:0 auto;padding:12px 16px 10px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:center;}
@media(max-width:820px){.top-inner{grid-template-columns:1fr;gap:8px;}}
.player{background:#000;border-radius:10px;overflow:hidden;border:1px solid var(--line);}
video{display:block;width:100%;max-height:46vh;}
.now{font-size:13px;line-height:1.6;}
.now .num{color:var(--gold);font-weight:600;font-size:12px;}
.now .tt{font-size:16px;font-weight:600;margin:4px 0;line-height:1.4;}
.now .info{color:var(--muted);font-size:11px;}
.ctrl{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
button{background:rgba(214,172,92,.12);color:var(--paper);border:1px solid rgba(214,172,92,.35);
       border-radius:7px;padding:7px 12px;cursor:pointer;font-size:12px;transition:.15s;}
button:hover{background:rgba(214,172,92,.28);}
button.primary{background:var(--gold);color:#1a1408;font-weight:600;}

/* ===== 下方滚动目录 ===== */
.wrap{max-width:1200px;margin:0 auto;padding:16px 16px 60px;}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.toolbar h1{font-size:20px;margin:0 6px 0 0;letter-spacing:.06em;}
.toolbar .stat{color:var(--muted);font-size:12px;}
.search{flex:1;min-width:180px;background:rgba(255,255,255,.05);border:1px solid var(--line);
        border-radius:8px;padding:8px 12px;color:var(--paper);font-size:13px;outline:none;}
.search:focus{border-color:var(--gold);}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.filters button{padding:5px 12px;font-size:12px;}
.filters button.on{background:var(--gold);color:#1a1408;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;}
.card{background:rgba(255,255,255,.025);border:1px solid rgba(214,172,92,.14);border-radius:9px;
      padding:11px 13px;cursor:pointer;transition:.15s;position:relative;}
.card:hover{border-color:var(--gold);background:rgba(214,172,92,.08);transform:translateY(-1px);}
.card.active{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold);background:rgba(214,172,92,.1);}
.card .hd{display:flex;align-items:center;gap:8px;}
.card .badge{background:rgba(214,172,92,.18);color:var(--gold);border-radius:5px;padding:2px 7px;font-size:10px;flex:none;}
.card .name{font-size:13px;line-height:1.45;flex:1;}
.card .meta{color:var(--muted);font-size:11px;margin-top:6px;display:flex;justify-content:space-between;}
.card .prompt-ic{position:absolute;right:10px;top:10px;font-size:10px;color:var(--gold);
                  border:1px solid var(--line);border-radius:4px;padding:1px 5px;opacity:.7;}
.card:hover .prompt-ic{opacity:1;}

/* ===== 提示词浮动层 ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;
         align-items:center;justify-content:center;padding:20px;}
.overlay.show{display:flex;}
.modal{background:#141722;border:1px solid var(--line);border-radius:14px;max-width:680px;width:100%;
       max-height:82vh;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.7);}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.modal-h .t{font-size:16px;font-weight:600;line-height:1.4;}
.modal-h .s{color:var(--muted);font-size:11px;margin-top:4px;}
.close{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;padding:0 4px;line-height:1;}
.close:hover{color:var(--paper);}
.modal-b{padding:18px 20px;overflow-y:auto;}
.plabel{color:var(--gold);font-size:11px;letter-spacing:.1em;margin-bottom:10px;}
.ptext{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.85;color:#e8e2d4;
       background:rgba(255,255,255,.03);border-left:2px solid var(--gold);padding:14px 16px;border-radius:0 8px 8px 0;}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;}
.empty{color:var(--muted);font-style:italic;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--gold);
       color:#1a1408;padding:10px 22px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;
       transition:.25s;z-index:200;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.card .art{font-size:11px;color:#8fb7d9;margin-top:5px;line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;text-decoration:none;display:block;}
.card .art:hover{color:#bfe0ff;text-decoration:underline;}
.card .art:before{content:"\1F517 ";opacity:.7;font-size:10px;}
#m-src{font-size:12px;color:#8fb7d9;margin:8px 0 4px;}
#m-src a{color:#8fb7d9;text-decoration:underline;cursor:pointer;}
#m-src a:hover{color:#bfe0ff;}
</style>

// 分组过滤
const batches=[{k:'all',n:'全部'},{k:1,n:'第一批·28'},{k:2,n:'第二批·99'},{k:3,n:'第三批·23'}];
const fb=$('filters');
batches.forEach(b=>{
  const btn=document.createElement('button');
  btn.textContent=b.n; btn.className=b.k==='all'?'on':'';
  btn.onclick=()=>{filter=b.k;[...fb.children].forEach(x=>x.classList.remove('on'));btn.classList.add('on');render();};
  fb.appendChild(btn);
});

function render(){
  const q=$('search').value.trim().toLowerCase();
  const list=V.filter(it=>(filter==='all'||it.batch==filter) &&
    (!q || it.title.toLowerCase().includes(q) || it.prompt.toLowerCase().includes(q) || it.vid.includes(q) || it.article.toLowerCase().includes(q)));
  $('stat').textContent=`共 ${list.length} 段 · 点标题播放 · 点「提示词」查看生成词`;
  grid.innerHTML='';
  list.forEach(it=>{
    const i=it.n-1;
    const d=document.createElement('div');
    d.className='card'+(i===cur?' active':'');
    const bm={1:'一批',2:'二批',3:'三批'}[it.batch];
    d.innerHTML=`<span class="prompt-ic">提示词</span>
      <div class="hd"><span class="badge">${it.n} · ${bm}</span></div>
      <div class="name" style="margin-top:6px">${esc(it.title)}</div>
      <a class="art" href="${esc(it.article_url||'#')}" target="_blank" rel="noopener" title="${esc(it.article)}" onclick="event.stopPropagation()">${esc(it.article)}</a>
      <div class="meta"><span>${it.dur}s</span><span>${esc(it.group)}</span></div>`;
    d.onclick=()=>{
      const fromPrompt=event.target.classList.contains('prompt-ic');
      if(fromPrompt){openModal(i);}else{play(i);}
    };
    grid.appendChild(d);
  });
}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function play(i){
  if(i<0||i>=V.length)return;
  cur=i;const it=V[i];
  v.src=it.src;v.play().catch(()=>{});
  $('n-num').textContent=`第 ${it.n} / ${V.length} 段 · ${it.dur}s`;
  $('n-tt').textContent=it.title;
  $('n-info').textContent=`${it.vid} · ${it.article.slice(0,40)}`;
  [...grid.children].forEach((el,k)=>{});
  render();
  try{localStorage.setItem('vtotal_cur',i);}catch(e){}
}
function next(){play((cur+1)%V.length);}
function prev(){play((cur-1+V.length)%V.length);}
function fullscreen(){if(v.requestFullscreen)v.requestFullscreen();else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen();}
v.addEventListener('ended',()=>next());
document.addEventListener('keydown',e=>{
  if($('overlay').classList.contains('show')){if(e.key==='Escape')closeModal();return;}
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowDown'){next();e.preventDefault();}
  if(e.key==='ArrowUp'){prev();e.preventDefault();}
  if(e.key===' '){v.paused?v.play():v.pause();e.preventDefault();}
  if(e.key==='f'||e.key==='F')fullscreen();
});

// 提示词浮层
function openModal(i){
  modalIdx=i;const it=V[i];
  $('m-t').textContent=`${it.n}. ${it.title}`;
  $('m-s').textContent=`${it.vid} · ${it.dur}s`;
  $('m-src').innerHTML=it.article_url?`来源：<a href="${esc(it.article_url)}" target="_blank" rel="noopener">${esc(it.article)} ↗</a>`:`来源：${esc(it.article)}`;
  $('m-p').textContent=it.prompt||'（原文未提取到独立提示词）';
  $('m-p').className='ptext'+(it.prompt?'':' empty');
  $('overlay').classList.add('show');
}
function closeModal(){$('overlay').classList.remove('show');}
function playPrompt(){if(cur>=0)openModal(cur);else{toast('请先选择一个视频');}}
function copyPrompt(){
  if(modalIdx<0)return;
  const t=V[modalIdx].prompt||'';
  if(!t){toast('无提示词可复制');return;}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast('提示词已复制')).catch(()=>fallbackCopy(t));
  }else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);
  ta.select();try{document.execCommand('copy');toast('提示词已复制');}catch(e){toast('复制失败');}
  document.body.removeChild(ta);
}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}

render();
try{const s=localStorage.getItem('vtotal_cur');if(s!==null&&+s<V.length){/* 不自动播，仅保留 */}}catch(e){}
</script>
</body>
</html>
